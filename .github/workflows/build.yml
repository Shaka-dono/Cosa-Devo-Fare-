name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Estrai lo zip
        run: |
          rm -rf progetto && mkdir progetto
          unzip -o cosa-devo-fare.zip -d progetto
          echo "DIR=$(dirname "$(find progetto -name settings.gradle.kts | head -n 1)")" >> $GITHUB_ENV

      - name: Compila
        run: |
          cd "$DIR"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CosaDevoFare-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
